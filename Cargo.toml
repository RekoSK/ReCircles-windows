[workspace]
resolver = "2"
members = [
    "crates/recircles-core",
    "crates/recircles-submenu-abi",
    "crates/recircles-sub-files",
    "crates/recircles-sub-apps",
    "crates/recircles-sub-windows",
    "crates/recircles-sub-clipboard",
    "crates/recircles-daemon",
    "crates/recircles-ui",
    "crates/recircles-installer",
]

[workspace.package]
version = "0.2.2-beta"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
panic = "abort"
